{% extends 'base.html' %}
{% block body %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge">🔐</div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to access and share campus notes</p>
    </div>

    <form class="auth-form" method='post'>
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input id="login-email" class="input-field" name='email' type='email' placeholder='student@campus.edu' required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input id="login-password" class="input-field" name='password' type='password' placeholder='••••••••' required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <span>Log In</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </form>

    <div class="auth-footer">
      <p>New to CampusNotes? <a href='/signup' class="auth-switch-link">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
